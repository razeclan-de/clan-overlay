[package]
name = "raze-overlay"
version = "1.0.0"
description = "Raze Clan Overlay"
authors = ["Du"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# HIER war der Fehler: Wir müssen "global-shortcut" direkt in der tauri-Zeile laden
tauri = { version = "1.5", features = ["shell-open", "global-shortcut"] }

[features]
# Hier setzen wir es wieder auf den Standard zurück, da wir es oben geladen haben
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
