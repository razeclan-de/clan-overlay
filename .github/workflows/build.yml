name: Release Overlay

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build App
        # Das --verbose hilft uns, Fehler zu sehen, falls es wieder nicht klappt
        run: npm run tauri build -- --verbose

      - name: Alles auflisten (Debug)
        run: |
          echo "Suche nach EXE Dateien..."
          Get-ChildItem -Path src-tauri/target/release -Recurse -Filter *.exe
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RazeOverlay-Portable
          # Der Trick: Wir suchen rekursiv (**) nach jeder .exe im release Ordner
          path: src-tauri/target/release/**/*.exe
          if-no-files-found: warn
