name: Release Overlay

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build App
        run: npm run tauri build

      # NEU: Dieser Schritt zeigt uns im Protokoll, welche Dateien existieren!
      - name: List Files (Debug)
        run: |
          echo "Listing release directory:"
          Get-ChildItem -Path src-tauri/target/release -Recurse
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RazeOverlay-Windows
          # Die zwei Sternchen ** bedeuten: Suche in allen Unterordnern nach ALLEM
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn
